name: Public documentation

on:
  pull_request:
    paths:
      - '.github/workflows/docs-site.yml'
      - 'build.gradle.kts'
      - 'client/**'
      - 'core/**'
      - 'docs/site/**'
      - 'documentation/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'mkdocs.yml'
      - 'platform/**'
      - 'sample/**'
      - 'server/**'
      - 'settings.gradle.kts'
      - 'tools/docs/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs-site.yml'
      - 'build.gradle.kts'
      - 'client/**'
      - 'core/**'
      - 'docs/site/**'
      - 'documentation/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'mkdocs.yml'
      - 'platform/**'
      - 'sample/**'
      - 'server/**'
      - 'settings.gradle.kts'
      - 'tools/docs/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified artifact when repository deployment is enabled
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Build public documentation
        run: ./gradlew docsSiteCheck --stacktrace
      - name: Upload review artifact and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-documentation-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/docs-site/site
            build/docs-site/reports
      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs-site/site
          retention-days: 1

  deploy:
    name: Deploy approved artifact
    if: >-
      vars.DOCS_PAGES_DEPLOYMENT_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy == true)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
