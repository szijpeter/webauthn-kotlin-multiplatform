<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="600" data-theme="dark" class="desktop" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="overview-desktop-dark-title overview-desktop-dark-desc">
    <title id="overview-desktop-dark-title">WebAuthn repository overview</title>
    <desc id="overview-desktop-dark-desc">Client and JVM server stacks share the foundation; the server also uses the cryptography boundary, which uses the foundation; the client and foundation use the protocol model.</desc>
    <defs><style>:root {
      color-scheme: light dark;
      --paper: #ffffff; --ink: #293545; --muted: #667386;
      --line: #d8dee7; --panel: #f3f5f7; --accent: #316da8; --accent-soft: #e8f0f8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1d242d; --ink: #edf1f5; --muted: #b4bfcc;
        --line: #3c4755; --panel: #28313d; --accent: #82b5e8; --accent-soft: #263f58;
      }
    }
    [data-theme="light"] {
      --paper: #ffffff; --ink: #293545; --muted: #667386;
      --line: #d8dee7; --panel: #f3f5f7; --accent: #316da8; --accent-soft: #e8f0f8;
    }
    [data-theme="dark"] {
      --paper: #1d242d; --ink: #edf1f5; --muted: #b4bfcc;
      --line: #3c4755; --panel: #28313d; --accent: #82b5e8; --accent-soft: #263f58;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    main { max-width: 960px; margin: 0 auto; }
    svg { display: block; width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, system-ui, Helvetica, Arial, sans-serif; }
    .paper { fill: var(--paper); }
    .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
    .arrow { fill: var(--muted); }
    .arrow-accent { fill: var(--accent); }
    .arrow-link { fill: var(--accent); }
    .node { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
    .foundation { fill: var(--accent-soft); stroke: var(--accent); }
    .model { fill: var(--panel); }
    .title { fill: var(--ink); font-size: 28px; font-weight: 720; letter-spacing: -0.5px; }
    .name { fill: var(--ink); font-size: 20px; font-weight: 650; }
    .detail { fill: var(--muted); font-size: 16px; }
    .caption { fill: var(--muted); font-size: 12px; }
    .rule { stroke: var(--line); stroke-width: 1; }
    svg.mobile { display: none; max-width: 480px; margin: 0 auto; }
    @media (max-width: 720px) {
      svg.desktop { display: none; }
      svg.mobile { display: block; }
    }
svg.desktop, svg.mobile { display: block !important; }
</style>
      <marker id="desktop-dark-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path class="arrow" d="M0 0 L8 3 L0 6 Z"/></marker>
      <marker id="desktop-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path class="arrow-accent" d="M0 0 L8 3 L0 6 Z"/></marker>
      <marker id="desktop-dark-arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path class="arrow-link" d="M0 0 L8 3 L0 6 Z"/></marker>
    </defs>
    <rect class="paper" width="960" height="600"/>
    <text class="title" x="40" y="40">Five areas. One shared foundation.</text>
    <text class="caption" x="40" y="64">WebAuthn Kotlin Multiplatform · repository responsibilities</text>
    <g class="edge" marker-end="url(#desktop-dark-arrow)">
      <path data-from="CLIENT" data-to="FOUNDATION" d="M224 192 V304"/>
      <path data-from="CLIENT" data-to="MODEL" d="M96 144 H64 Q56 144 56 152 V512 Q56 520 64 520 H96"/>
      <path data-from="SERVER" data-to="FOUNDATION" d="M560 144 H488 Q480 144 480 152 V248 Q480 256 472 256 H312 Q304 256 304 264 V304"/>
      <path data-from="SERVER" data-to="CRYPTO" d="M712 192 V304"/>
      <path data-from="CRYPTO" data-to="FOUNDATION" d="M560 352 H400"/>
      <path data-from="FOUNDATION" data-to="MODEL" d="M248 400 V480"/>
    </g>
    <g data-node="CLIENT">
      <rect class="node" x="96" y="96" width="304" height="96" rx="8"/>
      <text class="name" x="120" y="128">Client stack</text>
      <text class="detail" x="120" y="152">Shared orchestration</text><text class="detail" x="120" y="176">and platform bridges</text>
    </g>
    <g data-node="SERVER">
      <rect class="node" x="560" y="96" width="304" height="96" rx="8"/>
      <text class="name" x="584" y="128">JVM server stack</text>
      <text class="detail" x="584" y="152">Ceremonies, storage</text><text class="detail" x="584" y="176">and HTTP adapters</text>
    </g>
    <g data-node="FOUNDATION">
      <rect class="node foundation" x="96" y="304" width="304" height="96" rx="8"/>
      <text class="name" x="120" y="336">Shared foundation</text>
      <text class="detail" x="120" y="360">Validation, serialization</text><text class="detail" x="120" y="384">and runtime</text>
    </g>
    <g data-node="CRYPTO">
      <rect class="node" x="560" y="304" width="304" height="96" rx="8"/>
      <text class="name" x="584" y="336">Cryptography boundary</text>
      <text class="detail" x="584" y="360">Crypto contracts</text><text class="detail" x="584" y="384">and implementations</text>
    </g>
    <g data-node="MODEL">
      <rect class="node model" x="96" y="480" width="304" height="80" rx="8"/>
      <text class="name" x="120" y="512">Protocol model</text>
      <text class="detail" x="120" y="536">Typed WebAuthn contracts</text>
    </g>
    <line class="rule" x1="440" y1="480" x2="864" y2="480"/>
    <text class="caption" x="440" y="504">Arrows show logical relationships.</text>
    <text class="caption" x="440" y="524">This is not a complete module dependency graph.</text>
    <text class="caption" x="440" y="548">Blue highlights the shared foundation.</text>
  </svg>
