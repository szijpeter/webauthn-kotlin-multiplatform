<svg xmlns="http://www.w3.org/2000/svg" width="960" height="834" viewBox="0 0 960 834" role="img" aria-labelledby="public-home-flow-1-desktop-light-title public-home-flow-1-desktop-light-desc" data-diagram="public-home-flow-1">
<title id="public-home-flow-1-desktop-light-title">From user action to verified result</title>
<desc id="public-home-flow-1-desktop-light-desc">The platform supplies a credential response; the server makes the verification decision.
Nodes: Mobile UI; PasskeyFlow; Ktor backend contract; Registration or authentication service; Credential and ceremony stores; Android or iOS platform prompt.
1. Mobile UI → PasskeyFlow.
2. PasskeyFlow → Ktor backend contract.
3. Ktor backend contract → Registration or authentication service.
4. Registration or authentication service → Credential and ceremony stores.
5. PasskeyFlow → Android or iOS platform prompt.
6. Android or iOS platform prompt → PasskeyFlow.</desc>
