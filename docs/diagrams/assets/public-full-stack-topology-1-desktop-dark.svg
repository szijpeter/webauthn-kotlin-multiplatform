<svg xmlns="http://www.w3.org/2000/svg" width="960" height="677" viewBox="0 0 960 677" role="img" aria-labelledby="public-full-stack-topology-1-desktop-dark-title public-full-stack-topology-1-desktop-dark-desc" data-diagram="public-full-stack-topology-1">
<title id="public-full-stack-topology-1-desktop-dark-title">Full-stack topology</title>
<desc id="public-full-stack-topology-1-desktop-dark-desc">The mobile flow connects platform credential APIs to the relying-party backend.
Nodes: Compose shared UI and flow; Android Credential Manager; iOS Authentication Services; Ktor sample backend; Registration and authentication services; Ceremony and credential stores; Association endpoints.
1. Compose shared UI and flow → Android Credential Manager.
2. Compose shared UI and flow → iOS Authentication Services.
3. Compose shared UI and flow ↔ Ktor sample backend.
4. Ktor sample backend → Registration and authentication services.
5. Registration and authentication services → Ceremony and credential stores.
6. Ktor sample backend → Association endpoints.</desc>
