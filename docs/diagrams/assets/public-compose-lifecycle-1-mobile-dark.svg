<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1815" viewBox="0 0 400 1815" role="img" aria-labelledby="public-compose-lifecycle-1-mobile-dark-title public-compose-lifecycle-1-mobile-dark-desc" data-diagram="public-compose-lifecycle-1">
<title id="public-compose-lifecycle-1-mobile-dark-title">Ceremony lifecycle</title>
<desc id="public-compose-lifecycle-1-mobile-dark-desc">Product UI owns state, cancellation and the signed-in session.
Nodes: [start]; Idle; Starting; PlatformPrompt; Finishing; Failed; SignedIn.
1. [start] → Idle.
2. Idle → Starting: user action.
3. Starting → PlatformPrompt: start response.
4. PlatformPrompt → Finishing: signed response.
5. Starting → Failed: network or contract error.
6. PlatformPrompt → Idle: user cancellation.
7. PlatformPrompt → Failed: platform error.
8. Finishing → SignedIn: server accepts.
9. Finishing → Failed: server rejects.
10. SignedIn → Idle: product logout.</desc>
