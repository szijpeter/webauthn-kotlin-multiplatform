<title id="core-webauthn-core-readme-1-mobile-light-title">core · What it provides</title>
<desc id="core-webauthn-core-readme-1-mobile-light-desc">Selected responsibilities and relationships; see the surrounding module guide for scope and limits.
Nodes: Typed finish input — RegistrationValidationInput / AuthenticationValidationInput; validateClientData; validateAuthenticatorData; requireAllowedCredential; WebAuthnExtensionHook (optional); ValidationResult output; Server crypto verification — signature + attestation; Store signCount / credential state.
1. Typed finish input RegistrationValidationInput / AuthenticationValidationInput → validateClientData.
2. validateClientData → validateAuthenticatorData.
3. validateAuthenticatorData → requireAllowedCredential.
4. requireAllowedCredential → WebAuthnExtensionHook (optional).
5. WebAuthnExtensionHook (optional) → ValidationResult output.
6. ValidationResult output → Server crypto verification signature + attestation.
7. Server crypto verification signature + attestation → Store signCount / credential state.</desc>
