<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1578" viewBox="0 0 960 1578" role="img" aria-labelledby="readme-1-desktop-dark-title readme-1-desktop-dark-desc" data-diagram="readme-1">
<title id="readme-1-desktop-dark-title">WebAuthn ceremonies</title>
<desc id="readme-1-desktop-dark-desc">The server starts and verifies each ceremony; the platform produces the credential response.
Nodes: User; Client App; Platform Authenticator; Relying Party Server.
Notes: Registration ceremony; Authentication ceremony.
1. Client App → Relying Party Server: registration/start request.
2. Relying Party Server → Client App: registration/start response (challenge + options) (dashed).
3. Client App → Platform Authenticator: navigator.credentials.create / platform create.
4. Platform Authenticator → Client App: RegistrationResponse (dashed).
5. Client App → Relying Party Server: registration/finish (credential response).
6. Relying Party Server → Client App: verified registration (dashed).
7. Client App → Relying Party Server: authentication/start request.
8. Relying Party Server → Client App: authentication/start response (challenge + options) (dashed).
9. Client App → Platform Authenticator: navigator.credentials.get / platform get.
10. Platform Authenticator → Client App: AuthenticationResponse (dashed).
11. Client App → Relying Party Server: authentication/finish (credential response).
12. Relying Party Server → Client App: verified sign-in (dashed).</desc>
